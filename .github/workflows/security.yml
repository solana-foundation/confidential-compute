name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the toolchain and rustup does not install it on
      # demand, so install it the same way ./.github/actions/setup does.
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      # Pinned so the scanner does not change under us. Bump it on purpose.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      # Reads .cargo/audit.toml. Vulnerabilities fail the job; warnings do not.
      - name: Audit Cargo.lock
        run: cargo audit
