version: 2
updates:
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-patch
      - dependency-name: bincode
        update-types:
          - version-update:semver-major
    groups:
      solana:
        applies-to: version-updates
        patterns:
          - 'solana-*'
          - 'anchor-*'
        exclude-patterns:
          - 'solana-confidential-compute-*'
        update-types:
          - minor
          - major
      rustcrypto:
        applies-to: version-updates
        patterns:
          - p256
          - p384
          - rsa
          - crypto-bigint
          - rand
          - rand_core
          - sha2
          - subtle
          - zeroize
          - ecdsa
          - elliptic-curve
          - signature
          - digest
        update-types:
          - minor
          - major
      cargo-non-major:
        applies-to: version-updates
        update-types:
          - minor

  - package-ecosystem: bun
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-patch
    groups:
      sdk-non-major:
        applies-to: version-updates
        update-types:
          - minor
      docs-site-non-major:
        applies-to: version-updates
        update-types:
          - minor

  - package-ecosystem: github-actions
    directories:
      - '/'
      - '/.github/actions/setup'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-patch
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: '/bins/solana-confidential-compute-sidecar'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-patch
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: terraform
    directory: '/deploy/gcp'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-patch
    groups:
      terraform:
        patterns:
          - '*'
