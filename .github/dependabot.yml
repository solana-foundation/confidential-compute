version: 2
updates:
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-patch
    groups:
      cargo-non-major:
        applies-to: version-updates
        update-types:
          - minor

  - package-ecosystem: bun
    directory: '/sdks/typescript'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-patch
    groups:
      sdk-non-major:
        applies-to: version-updates
        update-types:
          - minor

  - package-ecosystem: bun
    directory: '/docs-site'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-patch
    groups:
      docs-site-non-major:
        applies-to: version-updates
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-patch
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: '/bins/solana-confidential-compute-sidecar'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-patch
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: terraform
    directory: '/deploy/gcp'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-patch
    groups:
      terraform:
        patterns:
          - '*'
