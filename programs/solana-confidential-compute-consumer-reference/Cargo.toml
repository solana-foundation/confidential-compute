[package]
name = "solana-confidential-compute-consumer-reference"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reference consumer program for Mode A and Mode B Solana Confidential Compute attestations."
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
solana-program = "4.1"
solana-confidential-compute-cpi = { workspace = true }
thiserror = { version = "2.0" }

[dev-dependencies]
solana-program-test = { version = "4.3", features = ["agave-unstable-api"] }
solana-sdk = "4.1"
solana-sdk-ids = "3.1"
solana-sysvar = "4.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
