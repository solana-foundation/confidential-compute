[package]
name = "solana-confidential-compute-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cryptographic parsing and verification engines for P-384, X.509, and JWTs."
keywords = ["solana", "attestation", "tee"]
categories = ["cryptography"]

[lints]
workspace = true

[dependencies]
solana-confidential-compute-core = { workspace = true }
crypto-bigint = { version = "0.7.10", default-features = false }
thiserror = { version = "2.0", default-features = false }
p384 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
hex = "0.4"
p384 = { version = "0.13", features = ["test-vectors", "alloc", "std"] }
ring = "0.17.14"

[features]
default = ["std"]
std = ["solana-confidential-compute-core/std", "p384/std", "sha2/std"]
