[package]
name = "solana-confidential-compute-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core types, report data structures, and attestation formats for Solana Confidential Compute."
keywords = ["solana", "attestation", "tee"]
categories = ["cryptography"]

[dependencies]
borsh = { version = "1.5", default-features = false, features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_bytes = { version = "0.11", default-features = false, features = ["alloc"] }
solana-program = { version = "4.1", default-features = false }
thiserror = { version = "2.0", default-features = false }

[features]
default = ["std"]
std = ["borsh/std", "serde/std", "thiserror/std"]
