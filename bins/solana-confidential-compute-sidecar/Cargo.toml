[package]
name = "solana-confidential-compute-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Confidential hardware enclave sidecar daemon for Solana Confidential Compute."
publish = false

[[bin]]
name = "solana-confidential-compute-sidecar"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
base64 = "0.23"
bincode = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
bs58 = "0.5.1"
rand_core = { version = "0.6.4", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
solana-client = "4.3"
solana-sdk = "4.1"
solana-system-interface = { version = "3.3", features = ["bincode"] }
solana-compute-budget-interface = "3.1"
solana-sdk-ids = "3.1"
solana-commitment-config = "3.1"
subtle = "2.6"
solana-confidential-compute-core = { workspace = true, features = ["std"] }
solana-confidential-compute-cpi = { workspace = true }
solana-confidential-compute-crypto = { workspace = true, features = ["std"] }
solana-confidential-compute-sdk = { workspace = true, features = ["test-utils"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
