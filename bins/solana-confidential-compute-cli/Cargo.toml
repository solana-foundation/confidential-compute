[package]
name = "solana-confidential-compute-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line interface to prove and verify Solana keypairs in hardware enclaves."
publish = false

[[bin]]
name = "solana-confidential-compute"
path = "src/main.rs"

[dependencies]
bincode = "3.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
p384 = { version = "0.13", features = ["test-vectors"] }
sha2 = "0.10"
solana-sdk = "4.1"
solana-system-interface = { version = "3.3", features = ["bincode"] }
solana-compute-budget-interface = "3.1"
solana-packet = "4.4"
solana-sdk-ids = "3.1"
solana-confidential-compute-core = { workspace = true, features = ["std"] }
solana-confidential-compute-crypto = { workspace = true, features = ["std"] }
solana-confidential-compute-sdk = { workspace = true }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
